<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance Request</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo-text">🏥 Hospital System</div>
    <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="appointments.html">Appointments</a></li>
        <li><a href="ambulance.html">Ambulance</a></li>
        <li><a href="index.html">Logout</a></li>
    </ul>
</header>

<div class="dashboard">
    <h1>🚑 Ambulance Request</h1>
    <div class="ambulance-box">
        <label for="patientName">Patient Name</label>
        <input id="patientName" type="text" placeholder="Enter patient name">

        <label for="pickupLocation">Pickup Location</label>
        <input id="pickupLocation" type="text" placeholder="Enter pickup address">

        <label for="destination">Destination</label>
        <input id="destination" type="text" placeholder="Enter hospital or clinic">

        <label for="condition">Patient Condition</label>
        <select id="condition">
            <option>General Emergency</option>
            <option>Critical</option>
            <option>Medical Transport</option>
            <option>Post-surgery Transfer</option>
        </select>

        <label for="notes">Additional Notes</label>
        <textarea id="notes" placeholder="Describe the situation"></textarea>

        <button type="button" onclick="requestAmbulance()">Request Ambulance</button>
        <div id="ambulanceStatus"></div>
    </div>
</div>

<script>
function requestAmbulance() {
    document.getElementById("ambulanceStatus").innerHTML = `
        <div style="background:#d1e7dd; padding:20px; margin-top:20px; border-radius:10px;">
            <h2 style="color:green;">✅ Ambulance Requested</h2>
            <p>Your request has been received. The ambulance will arrive shortly.</p>
            <p><b>Patient:</b> ${document.getElementById("patientName").value || "Not specified"}</p>
            <p><b>Pickup:</b> ${document.getElementById("pickupLocation").value || "Not specified"}</p>
        </div>
    `;
}
</script>

</body>
</html>
